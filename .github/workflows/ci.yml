name: CI
on:
  push:
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Gerar catálogo a partir do CSV
        run: npm run build:catalog
      - name: Conferir que catalog-data.js está atualizado
        run: git diff --exit-code public/js/catalog-data.js
      - run: npm test
